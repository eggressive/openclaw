name: Secret Scan (Gitleaks)

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    # Weekly full-history scan, Sundays at 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: read
  # Required for SARIF upload in the scheduled full-history scan
  security-events: write

jobs:
  # Blocking scan: checks only new/changed commits on push and PR.
  # Fails the build if a real secret is introduced.
  gitleaks:
    name: Gitleaks (new commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks on new commits
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          if [ "${{ github.event_name }}" = "push" ]; then
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
            /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 -v --log-opts="--no-merges $RANGE"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 -v --log-opts="--no-merges $RANGE"
          else
            echo "Scheduled run — skipping incremental scan, full-history scan runs separately"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Non-blocking scan: full git history, all branches.
  # Runs weekly on schedule. Uploads SARIF results. Never fails the build.
  gitleaks-full-history:
    name: Gitleaks (full history, non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks on full history
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 0 \
            --report-format sarif \
            --report-path results.sarif \
            -v \
            --log-opts="--all" || true
          echo "Full-history scan complete. Review results.sarif artifact for findings."
          if [ ! -f results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"gitleaks","version":"8.24.3","informationUri":"https://github.com/gitleaks/gitleaks"}},"results":[]}]}' > results.sarif
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: gitleaks-full-history
